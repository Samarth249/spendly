<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Spendly – Sign In</title>
  <script src="theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      --bg-base:        #0a0a0f;
      --bg-surface:     #111118;
      --bg-card:        rgba(30, 30, 40, 0.7);
      --accent-primary: #7c6aff;
      --accent-glow:    rgba(124, 106, 255, 0.35);
      --accent-mid:     #9d8fff;
      --success:        #34d88c;
      --danger:         #ff5f6d;
      --text-primary:   #f0f0f8;
      --text-secondary: #8888aa;
      --text-muted:     #55556a;
      --border:         rgba(255, 255, 255, 0.08);
      --border-strong:  rgba(255, 255, 255, 0.14);
      --radius-sm:      10px;
      --radius-md:      16px;
      --radius-xl:      28px;
      --radius-full:    999px;
      --shadow-card:    0 12px 40px rgba(0, 0, 0, 0.6);
      --transition:     0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, var(--accent-wash), transparent 60%),
                  radial-gradient(circle at 85% 90%, var(--success-wash), transparent 50%),
                  var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      padding: 36px 28px;
      box-shadow: var(--shadow-card), 0 0 40px var(--accent-glow);
      display: flex;
      flex-direction: column;
      animation: fadeInScale 0.4s ease-out;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-deep));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary) 40%, var(--accent-mid));
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Switch Tabs */
    .auth-tabs {
      display: flex;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 4px;
      margin-bottom: 22px;
    }

    .auth-tab {
      flex: 1;
      padding: 9px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--radius-full);
      transition: all var(--transition);
    }

    .auth-tab.active {
      color: var(--text-on-accent);
      background: var(--accent-primary);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    /* Alert Banner */
    .alert-banner {
      display: none;
      padding: 11px 14px;
      margin-bottom: 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
    }
    .alert-banner.error {
      display: block;
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }
    .alert-banner.success {
      display: block;
      background: var(--success-soft);
      border: 1px solid var(--success-border);
      color: var(--success);
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all var(--transition);
    }

    .form-input:focus {
      border-color: var(--accent-primary);
      background: var(--input-focus-bg);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-deep));
      color: var(--text-on-accent);
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--accent-glow);
      transition: transform var(--transition), box-shadow var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--accent-glow);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-links {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-links a {
      color: var(--accent-mid);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .offline-bypass {
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
  </style>
  <link rel="stylesheet" href="themes.css" />
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          <path d="M12 6v6l4 2"/>
        </svg>
      </div>
      <h1 class="brand-name">Spendly</h1>
      <p class="brand-sub">Daily Expense & Finance Tracker</p>
    </div>

    <div class="auth-tabs">
      <a href="login.html" class="auth-tab active">Sign In</a>
      <a href="register.html" class="auth-tab">Create Account</a>
    </div>

    <div id="alertBanner" class="alert-banner"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-input" placeholder="you@domain.com" required autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" id="togglePwd" class="toggle-pwd" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span>Sign In to Dashboard</span>
      </button>

      <div class="footer-links">
        <div>Don't have an account? <a href="register.html">Sign up</a></div>
        <div class="offline-bypass">
          Prefer offline mode? <a href="index.html">Unlock via PIN Code &rarr;</a>
        </div>
      </div>
    </form>
  </div>

  <script>
    const isDevHost = ['localhost', '127.0.0.1', '0.0.0.0', ''].includes(window.location.hostname);
    const API_BASE = isDevHost ? `http://${window.location.hostname || 'localhost'}:5000/api` : '/api';
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');
    const togglePwd = document.getElementById('togglePwd');

    // Password visibility toggle
    togglePwd.addEventListener('click', () => {
      const isPwd = passwordInput.type === 'password';
      passwordInput.type = isPwd ? 'text' : 'password';
      togglePwd.textContent = isPwd ? '🙈' : '👁️';
    });

    function showAlert(msg, isSuccess = false) {
      alertBanner.textContent = msg;
      alertBanner.className = `alert-banner ${isSuccess ? 'success' : 'error'}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.className = 'alert-banner';
      alertBanner.textContent = '';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Please enter both email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Signing In...</span>';

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed. Please verify credentials.');
        }

        // Ensure strict user isolation on shared devices
        localStorage.removeItem('spendly_db_offline');
        localStorage.removeItem('spendly_offline_local');
        localStorage.removeItem('spendly_persona');
        localStorage.removeItem('spendly_onboarded');
        localStorage.removeItem('spendly_auth_token');
        localStorage.removeItem('spendly_user');
        sessionStorage.setItem('spendly_auth_token', data.token);

        // Store auth token & user
        showAlert('Login successful! Redirecting to dashboard...', true);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In to Dashboard</span>';
      }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error:', err));
    }
  </script>
</body>
</html>
