
# SonarQube Project Identification
sonar.projectKey=spendly
sonar.projectName=Spendly
sonar.projectVersion=1.0

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# JavaScript test coverage report
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# File exclusions for analysis
sonar.exclusions=**/*.md,Dockerfile,Jenkinsfile,backend/node_modules/**,**/node_modules/**,backend/spendly.db,**/coverage/**
