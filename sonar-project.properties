
# SonarQube Project Identification
sonar.projectKey=spendly
sonar.projectName=Spendly
sonar.projectVersion=1.0

# Source configuration
sonar.sources=.
sonar.tests=backend/test
sonar.test.inclusions=backend/test/**/*.test.js
sonar.sourceEncoding=UTF-8

# JavaScript test coverage report
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Keep test files out of production source analysis and exclude generated or local data.
sonar.exclusions=**/*.md,Dockerfile,Jenkinsfile,**/node_modules/**,**/coverage/**,backend/test/**,backend/*.db,backend/*.db-*,backend/*.sqlite,backend/*.sqlite-*,backend/*.sqlite3,backend/*.sqlite3-*,backups/**,**/.env,**/.env.*
